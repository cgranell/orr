project:
  type: book
  resources: 
    - /static

book:
  title: "Open Reproducible Research: Practices and Tools"
  description: "What can I do to make my next article (more) reproducible?"
  keyword: open science, reproducibility, replicatibility, research practices, tools, quarto
  url: "https://cgranell.github.io/orr"
  site-url: "https://cgranell.github.io/orr"
  repo-url: "https://www.github.com/cgranell/orr"
  date: "3/26/2026"
  date-format: "MMM D, YYYY"
  reader-mode: true
  cover-image: "images/hex_sticker_ORR.png"
  image: "images/ESCOLA-DOCTORAT-es-blanco.png"
  author: 
    - id: granell
      name: 
        given: "Carlos"
        family: "Granell Canut"
        literal: "Carlos Granell Canut"
      orcid: "0000-0003-1004-9695"
      
      attributes:
        corresponding: true
        equal-contributor: true
        deceased: false
      roles:
        - conceptualization
        - project-administration
        - writing-original-draft
        - writing-review-editing
      affiliations:
        - name: "GEOTEC, Universitat Jaume I de Castellón, Spain"

  
  chapters:
    - index.qmd
    - part: "Foreword"
      chapters:
        - materials/00-personas.qmd
        - materials/00-units.qmd
        - materials/00-tech-stack.qmd
    - part: "Background"
      chapters:
        - materials/01-historical-notes.qmd
        - materials/01-concept.qmd
        - materials/01-comparison.qmd
    - part: "The Pre-reproducibility Assessment"
      chapters:
        - materials/02-assessment.qmd
    - part: "The Reproducibility Process: Practices and Recommendations"
      chapters:
        - materials/03-guidelines.qmd
        - materials/03-practices.qmd
        - materials/03-case-geotec.qmd
    - part: "ORR @ UJI"
      chapters:
        - materials/04-uji.qmd
    - part: "Tools"
    - references.qmd    
  appendices: 
    - materials/appendice-key-people.qmd
    - materials/appendice-glossary.qmd
    

  sidebar: 
    logo: "images/ESCOLA-DOCTORAT-es-negre.png"
    logo-alt: "Escola de Doctorat, UJI"
    logo-href: "https://www.uji.es/estudis/centres/escola-doctorat/base/Formacio-transversal/"
    #background: "#F5F5F5"

  page-footer:
    center: "[Open Reproducible Research (ORR)](https://cgranell.github.io/orr)"
    #background: "light"

bibliography: references.bib
citations-hover: true
citation-location: margin

format: 
  html:
    theme:
      light: cosmo
      dark: superhero #darkly
    grid: # https://quarto.org/docs/output-formats/page-layout.html
      sidebar-width: 200px
      body-width: 900px
      margin-width: 200px
      gutter-width: 1.0em

